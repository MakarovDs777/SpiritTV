<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpiriTV</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    #channels-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    iframe {
      width: 460px;
      height: 220px;
      border: none;
      box-sizing: border-box;
    }

    iframe.active {
      border: 4px solid #0f0;
    }

    iframe.inactive {
      border: 1px solid #ccc;
    }

    #controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    #frame-count-input {
      width: 60px;
    }
  </style>
</head>
<body>
  <div id="controls">
    <label for="frame-count-input">Фреймов:</label>
    <input type="number" id="frame-count-input" min="1" max="20" step="1" value="5" />
    <button id="start-btn">Start</button>
    <button id="stop-btn" disabled>Stop</button>
    <input type="number" id="speed-input" placeholder="Скорость" min="1" max="10" step="1" value="5" />
  </div>
  <div id="channels-container"></div>

  <script>
    const channelUrls = [
      "https://limehd.tv/channel/1kanal",
      "https://limehd.tv/channel/rossia1",
      "https://limehd.tv/channel/match",
      "https://limehd.tv/channel/ntv",
      "https://limehd.tv/channel/5kanal",
      "https://limehd.tv/channel/russiak",
      "https://limehd.tv/channel/rossia24",
      "https://limehd.tv/channel/karusel",
      "https://limehd.tv/channel/otr",
      "https://limehd.tv/channel/tvc",
      "https://limehd.tv/channel/rentv",
      "https://limehd.tv/channel/spas",
      "https://limehd.tv/channel/sts",
      "https://limehd.tv/channel/domashniy",
      "https://limehd.tv/channel/tv3",
      "https://limehd.tv/channel/pyatnica",
      "https://limehd.tv/channel/zvezda",
      "https://limehd.tv/channel/tv3",
      "https://limehd.tv/channel/tnt" // всего 19 фреймов
    ];

    const channelsContainer = document.getElementById('channels-container');
    let iframes = [];
    let previousIndex = -1;
    let isRunning = false;
    let intervalId = null;
    let interval = 1000;

    /**
     * Создает фреймы в контейнере из текущего массива channelUrls
     */
    function createFrames(count) {
      channelsContainer.innerHTML = ''; // очистка предыдущих фреймов
      iframes = [];
      for (let i = 0; i < count; i++) {
        const url = channelUrls[i % channelUrls.length]; // повторять каналы, если больше чем есть
        const iframe = document.createElement('iframe');
        iframe.src = url;
        iframe.allow = "autoplay";
        iframe.classList.add('inactive');
        channelsContainer.appendChild(iframe);
        iframes.push(iframe);
      }
      previousIndex = -1;
    }

    // Изначально создаем фреймы
    const frameCountInput = document.getElementById('frame-count-input');
    createFrames(parseInt(frameCountInput.value));

    // Обработка изменения количества фреймов
    frameCountInput.addEventListener('change', () => {
      const count = parseInt(frameCountInput.value) || 1;
      createFrames(count);
    });

    // Обработчики для кнопок
    document.getElementById('start-btn').addEventListener('click', () => {
      if (!isRunning && iframes.length > 0) {
        intervalId = setInterval(switchChannel, interval);
        document.getElementById('start-btn').disabled = true;
        document.getElementById('stop-btn').disabled = false;
        isRunning = true;
      }
    });

    document.getElementById('stop-btn').addEventListener('click', () => {
      if (isRunning) {
        clearInterval(intervalId);
        // Убираем активный стиль с текущего фрейма
        if (previousIndex >= 0 && iframes[previousIndex]) {
          iframes[previousIndex].classList.remove('active');
          iframes[previousIndex].classList.add('inactive');
        }
        document.getElementById('start-btn').disabled = false;
        document.getElementById('stop-btn').disabled = true;
        isRunning = false;
      }
    });

    // Обработка изменения скорости
    document.getElementById('speed-input').addEventListener('change', (event) => {
      interval = parseInt(event.target.value) * 1000;
      if (isRunning) {
        clearInterval(intervalId);
        intervalId = setInterval(switchChannel, interval);
      }
    });

    // Основная функция переключения каналов
    function switchChannel() {
      // Удаляем активный класс у всех
      iframes.forEach(iframe => {
        iframe.classList.remove('active');
        iframe.classList.add('inactive');
      });
      const index = Math.floor(Math.random() * iframes.length);
      iframes[index].classList.remove('inactive');
      iframes[index].classList.add('active');

      // Включение звука (если нужно)
      iframes[index].contentWindow.postMessage(
        '{"method":"setVolume","params":[100]}', '*'
      );

      previousIndex = index;
    }

    // Пример: можно изменить число фреймов программно
    // createFrames(10);
  </script>
</body>
</html>
